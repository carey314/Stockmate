name: stockmate
description: "AI 原生多场景进销存"
publish_to: 'none'
version: 1.0.0+1   # TestFlight 每次上传 build 号(+后面)必须递增

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  shared_preferences: ^2.3.3
  mobile_scanner: ^7.1.4
  qr_flutter: ^4.1.0
  speech_to_text: ^7.0.0
  sign_in_with_apple: ^6.1.3
  image_picker: ^1.1.2
  in_app_purchase: ^3.2.0
  url_launcher: ^6.3.0
  share_plus: ^10.1.2
  path_provider: ^2.1.5
  intl: ^0.20.1
  cupertino_icons: ^1.0.8
  print_bluetooth_thermal: ^1.2.2
  esc_pos_utils_plus: ^2.0.4
  image: ^4.9.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
